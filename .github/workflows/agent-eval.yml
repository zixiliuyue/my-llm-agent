name: Agent Eval Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 用途：读取仓库根 .nvmrc，保证 CI 与本地 nvm 使用同一 Node 版本，
          # 避免 CI 绿灯但学习者本地版本不一致导致跑不起来的版本漂移问题。
          node-version-file: .nvmrc

      - name: Check day structure
        run: npm run test:structure

      - name: Run unit tests
        run: npm test

      - name: Run agent harness gate
        run: npm run day58:gate

      - name: Run CI eval comparison
        run: npm run day70:ci
