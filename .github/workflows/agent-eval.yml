name: SRE RCA Agent Test & Benchmark CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Pull Alpine 3.20 Sandbox Image
        run: docker pull alpine:3.20

      - name: Run Unit & Real Docker Sandbox Tests
        run: go test -v -race ./...

      - name: Verify CLI Single-Ticket Diagnosis
        run: go run ./cmd/sre-agent --ticket-id INC-2026-0059 --json
