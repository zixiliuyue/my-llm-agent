services:
  postgres:
    image: postgres:16-alpine
    # 安全边界：口令改为环境变量注入，避免弱口令硬编码进仓库；
    # 未设置时回退到本地演示默认值，真实环境必须通过 .env 覆盖。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: agent_runtime
    ports:
      - "54327:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "63797:6379"
  api:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["node", "src/cli.js"]
    depends_on:
      - postgres
      - redis
  worker:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["node", "src/cli.js"]
    depends_on:
      - postgres
      - redis
